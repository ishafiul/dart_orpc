name: rust_http prebuilt

# Builds the rust_http native library for every supported target and
# publishes it as the GitHub release rust_http-native-<fingerprint>, which the
# build hook downloads so apps build without Rust.
#
# Run it on main after the Rust sources change, then run
# `dart run tool/prebuilt.dart update` in packages/rust_http and commit the
# updated prebuilt_manifest.dart before publishing the package.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.fingerprint.outputs.tag }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - id: fingerprint
        working-directory: packages/rust_http
        run: dart run tool/prebuilt.dart fingerprint >> "$GITHUB_OUTPUT"
      - name: Stop if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.fingerprint.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists for these sources."
            exit 1
          fi

  build:
    needs: fingerprint
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc 2.17 through cargo-zigbuild, so the library loads on older
          # distributions than the runner's.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            file: librust_http.so
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            file: librust_http.so
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            file: librust_http.dylib
            macos_min: '11.0'
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            file: librust_http.dylib
            macos_min: '10.15'
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: rust_http.dll
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/rust_http/native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang cargo-zigbuild
          cargo zigbuild --release --locked --target ${{ matrix.zig_target }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build (Windows, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the asset
        run: |
          mkdir -p ../../../dist
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" \
            "../../../dist/${{ matrix.name }}-${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [fingerprint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write manifest.json
        working-directory: packages/rust_http
        run: dart run tool/prebuilt.dart manifest ../../dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.fingerprint.outputs.tag }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "rust_http native libraries $TAG" \
            --notes "Prebuilt rust_http native libraries for Rust sources with fingerprint $FINGERPRINT, built from $GITHUB_SHA." \
            --latest=false
