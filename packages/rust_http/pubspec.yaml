name: rust_http
description: >-
  Native HTTP/1.1 server for Dart. Rust owns the sockets and parses HTTP;
  handlers stay in Dart and use the dart:io HttpServer API.
version: 0.1.0-dev.3
repository: https://github.com/ishafiul/dart_orpc/tree/main/packages/rust_http
issue_tracker: https://github.com/ishafiul/dart_orpc/issues
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.6
  hooks: ^2.2.0

dev_dependencies:
  test: ^1.33.0
