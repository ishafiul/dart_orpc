[package]
name = "rust_http"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Native HTTP/1.1 core of the rust_http Dart package."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.10"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
slab = "0.4.12"
socket2 = { version = "0.6.5", features = ["all"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
httparse = "1.10.1"
httpdate = "1.0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
module_name_repetitions = "allow"
# Wire and connection state is naturally a set of independent flags.
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
