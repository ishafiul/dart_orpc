[package]
name = "rust_http-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
httparse = "1.10.1"
rust_http = { path = ".." }

[[bin]]
name = "parse_head"
path = "fuzz_targets/parse_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked_body"
path = "fuzz_targets/chunked_body.rs"
test = false
doc = false
bench = false
