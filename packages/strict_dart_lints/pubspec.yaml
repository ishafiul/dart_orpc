name: strict_dart_lints
description: Strict analyzer presets and analyzer-plugin rules that stop quick fixes, comments as documentation, and hidden escape hatches in Dart code.
version: 0.1.0-dev.1
repository: https://github.com/ishafiul/dart_orpc/tree/main/packages/strict_dart_lints
issue_tracker: https://github.com/ishafiul/dart_orpc/issues
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  analysis_server_plugin: 0.3.26
  analyzer: 14.7.0

dev_dependencies:
  analyzer_testing: 0.4.5
  test: ^1.33.0
  test_reflective_loader: ^0.6.0
