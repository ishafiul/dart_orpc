name: dart_orpc_user_test_benchmark
description: User Test Benchmark SQLite server for dart_orpc.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0

dependencies:
  dart_jsonwebtoken: ^3.4.1
  dart_orpc:
    path: ../../../packages/dart_orpc
  sqlite3: ^3.9.1

dependency_overrides:
  dart_orpc_annotations:
    path: ../../../packages/dart_orpc_annotations
  dart_orpc_client:
    path: ../../../packages/dart_orpc_client
  dart_orpc_core:
    path: ../../../packages/dart_orpc_core
  dart_orpc_http:
    path: ../../../packages/dart_orpc_http
  dart_orpc_luthor:
    path: ../../../packages/dart_orpc_luthor
  dart_orpc_openapi:
    path: ../../../packages/dart_orpc_openapi
  dart_orpc_websocket:
    path: ../../../packages/dart_orpc_websocket

dev_dependencies:
  build_runner: ^2.16.2
  dart_orpc_generator:
    path: ../../../packages/dart_orpc_generator
